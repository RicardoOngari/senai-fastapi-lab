
name: Pipeline CI/CD - Homologacao e Producao

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

env:
  IMAGE_NAME: ricardoongari/senai_fastapi

jobs:

  Build:
    name: Compilar Projeto e Executar Testes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v3
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest httpx

      - name: Executar testes
        run: |
          PYTHONPATH=. pytest tests/ -v --tb=short

  Imagem:
    name: Construir e Publicar Imagem Docker
    runs-on: ubuntu-latest
    needs: Build
    if: github.event_name == 'push'

    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construir e publicar imagem
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:${{ github.ref_name }}

  Deploy_Homologacao:
    name: Deploy Automatico - Homologacao
    runs-on: ubuntu-latest
    needs: Imagem
    if: github.ref == 'refs/heads/develop'

    steps:
      - name: Deploy via SSH na EC2 de Homologacao
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo docker pull ${{ env.IMAGE_NAME }}:${{ github.sha }}

            sudo docker stop senai_fastapi 2>/dev/null || true
            sudo docker rm senai_fastapi 2>/dev/null || true

            sudo docker run -d \
              --name senai_fastapi \
              --restart unless-stopped \
              -p 8080:8080 \
              ${{ env.IMAGE_NAME }}:${{ github.sha }}

            sleep 5
            curl -f http://localhost:8080/health || exit 1

            sudo docker image prune -f

  Deploy_Producao:
    name: Deploy Aprovado - Producao
    runs-on: ubuntu-latest
    needs: Imagem
    if: github.ref == 'refs/heads/main'

    environment:
      name: production

    steps:
      - name: Deploy via SSH na EC2 de Producao
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo docker pull ${{ env.IMAGE_NAME }}:${{ github.sha }}

            sudo docker stop senai_fastapi 2>/dev/null || true
            sudo docker rm senai_fastapi 2>/dev/null || true

            sudo docker run -d \
              --name senai_fastapi \
              --restart unless-stopped \
              -p 8080:8080 \
              ${{ env.IMAGE_NAME }}:${{ github.sha }}

            sleep 5
            curl -f http://localhost:8080/health || exit 1

            sudo docker image prune -f
